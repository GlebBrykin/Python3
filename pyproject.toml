[project]
name = "valutatrade_hub"
version = "0.1.0"
description = "ValutaTrade Hub"
authors = [{name = "Student"}]
requires-python = ">=3.12"
dependencies = ["prettytable>=3.10.0", "requests>=2.31.0"]

[project.scripts]
valutatrade = "valutatrade_hub.cli.interface:main"

[tool.uv]
dev-dependencies = ["ruff>=0.6.0"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".venv", "dist", "__pycache__", "data", "logs"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
